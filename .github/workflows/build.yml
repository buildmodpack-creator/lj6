name: Build LJCT
# Restored Gradle scaffold; Java 21 and official Mojang mappings.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build addon
        run: ./gradlew --no-daemon build

      - name: Upload addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: LJCT-Meteor-Addon
          path: build/libs/*.jar
          if-no-files-found: error
